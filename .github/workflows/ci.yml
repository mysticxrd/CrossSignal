name: Offline factory checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - name: Keep checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node factory/status.mjs
      - name: Keep the frozen factory unchanged
        if: github.event_name == 'pull_request'
        run: git diff --exit-code --stat origin/${{ github.base_ref }}...HEAD -- factory/
